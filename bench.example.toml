# PowerBench CLI — справочник параметров замера.
#
# ВАЖНО: это НЕ конфигурационный файл. PowerBench CLI не читает TOML и не
# имеет флага `--config` — все параметры задаются флагами командной строки.
# Раньше здесь лежал пример «конфига» с ключами `duration_seconds`,
# `export_raw_samples`, `out_path` и упоминанием `powerbench-cli bench --config
# bench.toml`. Ни одного из этих ключей программа никогда не читала, а флага
# `--config` не существовало: пользователь брал файл, правил его — и ничего не
# менялось. Теперь здесь только то, что действительно работает.
#
# Список флагов можно получить из программы: `powerbench-cli --help`

# ── Пресет ────────────────────────────────────────────────────────────────────
#   --preset quick      30 с прогона, 3 с разогрева, 3 с охлаждения, 1 раунд
#   --preset detailed   60 с прогона, 8 с разогрева, 5 с охлаждения, 5 раундов
#                      (по умолчанию)
powerbench-cli bench --preset detailed

# ── Длительность измеряемой части ─────────────────────────────────────────────
#   --duration <сек>   16…3600 (минимум — четыре фазы по 4 с)
# Делится на четыре фазы: база по 4 с (минимум 16 с), остаток — 30 % лёгкой,
# 20 % частичной, 35 % тяжёлой, остаток — «Отклику». Проценты берутся от
# остатка свыше базовых 16 с, поэтому фактические доли зависят от длительности:
# на 90 с выходит 26/18/29/17 с, а не 30/20/35/15.
powerbench-cli bench --duration 90

# ── Разогрев и охлаждение ─────────────────────────────────────────────────────
#   --warmup <сек>     от 2, профилем «Отклик»
#   --cooling <сек>    0…60, пауза между прогонами
powerbench-cli bench --warmup 10 --cooling 8

# ── Повторы ───────────────────────────────────────────────────────────────────
#   --reps <n>         1…9. Адаптивная остановка срабатывает от 3 и заметно
#                      окупается от 5.
powerbench-cli bench --reps 7

# ── Порог фоновой нагрузки ────────────────────────────────────────────────────
#   --threshold <%>    0,5…100 на ядро (по умолчанию 5,0). Выше порога замер
#                      не начнётся, пока не указан --allow-dirty-background.
powerbench-cli bench --threshold 3.0 --allow-dirty-background

# ── Воркеры пула ──────────────────────────────────────────────────────────────
#   --workers <n>      по умолчанию логические ядра − 2 (минимум 1)
powerbench-cli bench --workers 6

# ── Схемы питания ─────────────────────────────────────────────────────────────
#   --schemes <g1,g2>  только GUID через запятую, имена не принимаются;
#                      для сравнения нужно не меньше двух схем. Без флага
#                      программа предложит интерактивный выбор.
# Список GUID: `powerbench-cli list`
powerbench-cli bench --schemes "381b4222-f694-41f0-9685-ff5bb260df2e,8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c"

# ── Свой план сохранённой сессии ──────────────────────────────────────────────
#   --plan <guid>      план со своими настройками вместо пресета
#                      (для `resume` не поддерживается: он берёт план из
#                      контрольной точки)
powerbench-cli bench --plan 381b4222-f694-41f0-9685-ff5bb260df2e

# ── Куда писать результат ─────────────────────────────────────────────────────
#   --out <путь>       по умолчанию %LOCALAPPDATA%\PowerBench\benchmark-result.json
powerbench-cli bench --out .\result.json

# ── Прочие подкоманды ──────────────────────────────────────────────────────────
#   powerbench-cli list                     список схем питания
#   powerbench-cli resume                   продолжить прерванную сессию
#   powerbench-cli status                   состояние контрольной точки
#   powerbench-cli history list             список сохранённых сессий
#   powerbench-cli history export all       экспорт всех сессий
#   powerbench-cli settings show            текущие настройки приложения
#   powerbench-cli settings reset           сбросить настройки