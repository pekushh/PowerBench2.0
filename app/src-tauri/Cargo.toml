[package]
name = "powerbench-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Графическое приложение PowerBench (Tauri 2)."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
powerbench-orchestrator = { path = "../../orchestrator" }
powerbench-windows = { path = "../../windows" }
powerbench-core = { path = "../../core" }
powerbench-metrics = { path = "../../metrics" }
powerbench-recommend = { path = "../../recommend" }
