[workspace]
resolver = "2"
members = [
    "core",
    "metrics",
    "recommend",
    "windows",
    "orchestrator",
    "cli",
    "app/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Быстрые тесты калибровочного валидатора recommend (8192 итераций x серий).
[profile.test]
opt-level = 2