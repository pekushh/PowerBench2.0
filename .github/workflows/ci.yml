name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt, clippy, build)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workdir: .

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-targets

  security:
    name: Security Audit
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workdir: .

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-audit
        run: cargo audit

      - name: Run cargo-deny check
        run: cargo deny check || echo "cargo-deny not configured, skipping..."

  test:
    name: Test
    runs-on: windows-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workdir: .

      - name: Run tests
        run: cargo test --workspace --all-targets

  build-release:
    name: Build Release
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workdir: .

      - name: Build release
        run: cargo build --workspace --release --all-targets

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: powerbench-cli-${{ github.ref_name }}-windows-x64
          path: target/release/powerbench-cli.exe
          retention-days: 30

      - name: Upload App artifacts
        uses: actions/upload-artifact@v4
        with:
          name: powerbench-app-${{ github.ref_name }}-windows-x64
          path: |
            target/release/powerbench-app.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          retention-days: 30

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workdir: .

      - name: Build docs
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: target/doc
          retention-days: 30