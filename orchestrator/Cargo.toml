[package]
name = "powerbench-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Оркестрация теста: подготовка, фазы, раунды, контрольные точки, сторожевой таймер."

[dependencies]
powerbench-core = { path = "../core" }
powerbench-metrics = { path = "../metrics" }
powerbench-recommend = { path = "../recommend" }
powerbench-windows = { path = "../windows" }
serde.workspace = true
serde_json.workspace = true
csv = "1.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }