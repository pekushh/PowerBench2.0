# PowerBench CLI — пример конфигурации теста (bench.toml)
# Можно передать через: powerbench-cli bench --config bench.toml

[preset]
# Использовать пресет "quick" или "detailed", либо задать параметры вручную
name = "detailed"

[bench]
# Длительность измеряемой части (сумма трёх фаз). Минимум 9 с.
duration_seconds = 30

# Разогрев профилем "Отклик". Минимум 2 с.
warmup_seconds = 6

# Пауза охлаждения между прогонами. 0..=60 с.
cooling_seconds = 5

# Число раундов (повторов). 1..=9.
repetitions = 3

# Порог фоновой нагрузки в % на ядро. 0.5..=100.
background_threshold_percent = 5.0

# Число воркеров пула (None — значение по умолчанию движка: логические_ядер - 2).
# worker_count = 4

# GUID схем питания для теста (минимум 2 для сравнения).
# Если не задано — будет интерактивный выбор.
# scheme_ids = [
#   "381b4222-f694-41f0-9685-ff5bb260df2e",  # Balanced
#   "8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c",  # High Performance
#   "a1b2c3d4-e5f6-7890-abcd-ef1234567890",  # Custom
# ]

# Писать ли сырые сэмплы фаз каждого прогона отдельными JSON-файлами.
export_raw_samples = false

# Путь к итоговому JSON-результату (по умолчанию: %LOCALAPPDATA%\PowerBench\benchmark-result.json)
# out_path = "C:\\Results\\my-benchmark.json"